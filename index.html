<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zehra'ya Özel Sürpriz ❤️</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }
        .gift-container { cursor: pointer; position: relative; transition: transform 0.2s ease; }
        .gift-container:active { transform: scale(0.95); }
        .gift-box {
            width: 140px; height: 140px; background: #ff4d4d;
            position: relative; border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); margin: 0 auto;
        }
        .gift-box::before { content: ''; position: absolute; width: 30px; height: 100%; background: #ffcc00; left: 55px; top: 0; }
        .gift-box::after { content: ''; position: absolute; width: 100%; height: 30px; background: #ffcc00; top: 55px; left: 0; }
        .gift-lid {
            width: 160px; height: 40px; background: #ff3333;
            position: absolute; top: -20px; left: -10px; border-radius: 8px; z-index: 2;
            transition: transform 0.5s ease, opacity 0.5s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .gift-lid::before { content: ''; position: absolute; width: 30px; height: 100%; background: #ffcc00; left: 65px; top: 0; }
        #click-counter { margin-top: 20px; font-size: 18px; color: #fff; font-weight: bold; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
        #special-message {
            display: none; background: white; padding: 25px; border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); max-width: 400px; width: 100%;
            animation: fadeIn 0.8s ease forwards;
        }
        #special-message h2 { color: #ff3333; margin-bottom: 15px; font-size: 22px; }
        #special-message p { color: #444; font-size: 15px; line-height: 1.6; margin-bottom: 12px; }
        .poem { font-style: italic; color: #666; border-top: 1px solid #eee; padding-top: 10px; margin-top: 10px; }
        .open .gift-lid { transform: translateY(-80px) rotate(-15deg); opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div id="main-card">
        <div class="gift-container" id="giftContainer">
            <div class="gift-box"><div class="gift-lid"></div></div>
        </div>
        <div id="click-counter">Hediyeyi açmak için kutuya 5 kez dokun! (Kalan: 5)</div>
    </div>
    <div id="special-message">
        <h2>Zehra, Rojat seni çok çok çok seviyor! ❤️</h2>
        <p>Seni kırdığım için çok özür dilerim seviorumm seniii...</p>
        <p class="poem">
            Aşkınla çarpar bu deli yürek,<br>
            Adın dilimden düşmez hiç bilerek.<br>
            Seni kırmak, ah, en büyük keder,<br>
            Bağışla beni, sevdamız sonsuz sürer.
        </p>
    </div>
    <script>
        let counter = 0;
        const targetClicks = 5;
        const giftContainer = document.getElementById('giftContainer');
        const counterText = document.getElementById('click-counter');
        const mainCard = document.getElementById('main-card');
        const specialMessage = document.getElementById('special-message');
        giftContainer.addEventListener('click', () => {
            counter++;
            let remaining = targetClicks - counter;
            if (remaining > 0) {
                counterText.textContent = `Hediyeyi açmak için kutuya ${remaining} kez daha dokun!`;
            } else {
                mainCard.style.display = 'none';
                specialMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
